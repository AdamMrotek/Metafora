# Everything `make check` runs, plus the one invariant only CI can hold:
# `shared/contracts/src/*.ts` is generated, so a pydantic model edited without
# `make contracts` is a drift no reviewer reliably catches.
name: check

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
  # deploy.yml gates on this. A deploy that skips the check is a deploy of
  # something nobody checked, and reusing the job is the only way to be sure
  # the two never drift.
  workflow_call:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Plain Postgres, not the Supabase stack: nothing Supabase-specific (auth,
    # RLS, Realtime) is in the schema yet, and the migration is ordinary SQL.
    # Matches the hosted project's major version so a 17-only construct cannot
    # pass here and fail on push.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: |
          uv sync --frozen
          npm ci

      # No GROQ_API_KEY and no SFU: the suite is pure by construction, and a
      # test that needed either would be caught here rather than in review.
      - name: Test
        run: make test

      # The append-only triggers on config.protocols and transcript.events are
      # the schema's whole promise, and a later migration can drop one without
      # any test in the pure suite noticing.
      - name: Schema
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest -m postgres

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Contracts are in sync with the models
        run: |
          make contracts
          git diff --exit-code -- shared/contracts/src \
            || { echo "::error::shared/contracts/src is stale — run 'make contracts' and commit the result"; exit 1; }
