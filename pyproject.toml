[project]
name = "metafora"
version = "0.1.0"
description = "Clinical voice intake — one Python backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[livekit,groq,silero]>=1.7.0",
    "livekit-api>=1.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "loguru>=0.7",
    "asyncpg>=0.31.0",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "sentry-sdk[fastapi]>=2.20",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# Not a distributable package — one app, run from the repo root.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# `make test` stays pure — no key, no SFU, no database. Postgres-backed tests
# opt in via `make test-pg`, which supplies TEST_DATABASE_URL; browser tests via
# `make test-e2e`, which boots an SFU, a backend and the portal.
addopts = "-m 'not postgres and not browser'"
markers = [
    "postgres: needs a Postgres at TEST_DATABASE_URL (deselected by default)",
    "browser: drives a real Chromium against a real SFU (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
